# mic-app の CI ワークフローです。macOS / Windows のマトリクスで
# フロントエンド（lint・型チェック・テスト）と Rust（test・clippy）を検証します。
# OBS とのマイク共存など実機・手動確認が必要な項目はこの CI ではカバーせず、
# 計画書（win-mac-tauri-ai-mic-obs-linked-coral.md）の手動 E2E 手順で確認します。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint / type-check / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test

  rust:
    name: Rust (test / clippy)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux/Tauri system deps (no-op on macOS/Windows)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
